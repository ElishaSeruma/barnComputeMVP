[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "barnCompute"
version = "0.1.0a1"
description = "Private authenticated device groups and secure resumable file exchange"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "barnCompute contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "cryptography>=44.0,<46",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.35,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "twine>=6,<7",
]

[project.scripts]
barn = "barn_compute.cli:main"

[project.urls]
Repository = "https://github.com/ElishaSeruma/barnComputeMVP"

[tool.hatch.build.targets.wheel]
packages = ["src/barn_compute"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs", "scripts", ".github", ".gitignore",
                "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
